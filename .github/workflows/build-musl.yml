name: Build musl (Alpine)

on:
  workflow_dispatch:
    inputs:
      appimage_only:
        description: "Build only AppImage (skip tarball)"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - "Dev"
      - "main"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-musl:
    name: Build musl (Alpine)
    runs-on: ubuntu-latest

    steps:
      - name: Install mpv headers
        run: |
          sudo mkdir -p /tmp/mpv-headers/mpv
          sudo curl -sL "https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/client.h" -o /tmp/mpv-headers/mpv/client.h
          sudo curl -sL "https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/render.h" -o /tmp/mpv-headers/mpv/render.h
          sudo curl -sL "https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/render_gl.h" -o /tmp/mpv-headers/mpv/render_gl.h
          sudo curl -sL "https://raw.githubusercontent.com/mpv-player/mpv/master/include/mpv/stream_cb.h" -o /tmp/mpv-headers/mpv/stream_cb.h
          echo "MPV_INCLUDE=/tmp/mpv-headers" >> "$GITHUB_ENV"
          echo "mpv headers installed:" && ls -la /tmp/mpv-headers/mpv/ && head -3 /tmp/mpv-headers/mpv/client.h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-21-jdk-headless \
            musl-tools \
            gcc \
            make \
            git \
            curl

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Install appimagetool
        run: |
          sudo curl -sL "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -o /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make scripts executable
        run: chmod +x ./gradlew ./scripts/*.sh

      - name: Create local.properties
        run: touch local.properties

      - name: Read version
        id: version
        run: |
          version=$(grep '^VERSION_NAME=' composeApp/Configuration/DesktopVersion.properties | cut -d= -f2 | tr -d ' \r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version: $version"

      - name: Build with Gradle (musl-gcc)
        env:
          JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
        run: |
          ./gradlew \
            :composeApp:buildLinuxPlayerBridge \
            :composeApp:prepareLinuxPlayerRuntime \
            :composeApp:generateLinuxPlayerRuntimeIndex \
            :composeApp:desktopJar \
            --no-configuration-cache \
            -PlinuxCc=musl-gcc \
            -PlinuxCflags='-static-libgcc' \
            -PmpvInclude=/tmp/mpv-headers

      - name: Create AppDir
        run: |
          echo "=== Creating musl AppDir ==="
          APPDIR=/tmp/nuvio-musl.AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib/nuvio" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # Copy the JAR
          JAR_FILE=$(find composeApp/build -name "desktop*.jar" -type f 2>/dev/null | head -1)
          if [[ -n "$JAR_FILE" ]]; then
            cp "$JAR_FILE" "$APPDIR/usr/lib/nuvio/nuvio.jar"
            echo "JAR copied: $JAR_FILE"
          else
            echo "WARNING: desktop JAR not found"
          fi

          # Copy the musl-compiled native bridge
          cp composeApp/build/native/linux/libplayer_bridge.so "$APPDIR/usr/lib/nuvio/" 2>/dev/null || echo "WARNING: libplayer_bridge.so not found"

          # Copy the runtime files (libmpv.so, libmpv.so.2) from the build output
          cp composeApp/build/native/linux-runtime/* "$APPDIR/usr/lib/nuvio/" 2>/dev/null || echo "WARNING: no runtime files found"

          # Create launcher script
          printf '%s\n' '#!/bin/sh' 'APP_DIR="$(dirname "$0")"' 'LIB_DIR="$APP_DIR/../lib/nuvio"' 'exec java -Djava.library.path="$LIB_DIR" -jar "$LIB_DIR/nuvio.jar" "$@"' > "$APPDIR/usr/bin/nuvio"
          chmod +x "$APPDIR/usr/bin/nuvio"

          # Copy desktop file and icon
          cp composeApp/build/compose/binaries/main-release/app/Nuvio/Nuvio.desktop "$APPDIR/usr/share/applications/" 2>/dev/null || \
          cp composeApp/src/desktopMain/resources/*.desktop "$APPDIR/usr/share/applications/" 2>/dev/null || \
          echo "WARNING: .desktop file not found"
          find composeApp/src/desktopMain/resources -name "nuvio*256*.png" -exec cp {} "$APPDIR/usr/share/icons/hicolor/256x256/apps/nuvio-app-icon.png" \; 2>/dev/null || \
          cp composeApp/src/desktopMain/resources/icons/nuvio-app-icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/" 2>/dev/null || \
          echo "WARNING: icon not found"

          echo "=== AppDir contents ==="
          find "$APPDIR" -type f | sort

      - name: Create AppImage
        if: inputs.appimage_only != true
        run: |
          echo "=== Creating musl AppImage ==="
          appimagetool /tmp/nuvio-musl.AppDir "Nuvio-${{ steps.version.outputs.version }}-musl-x86_64.AppImage" || true

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: musl-appimage-${{ steps.version.outputs.version }}
          path: "Nuvio-*-musl-*.AppImage"
          if-no-files-found: ignore
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "Nuvio-*-musl-*.AppImage"
          draft: true
          generate_release_notes: true
